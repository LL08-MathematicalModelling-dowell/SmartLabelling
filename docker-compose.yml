version: '3.8'

services:
  # Kafka Service
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  # Backend Service
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: 
      - path: ./.env
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:29092
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - kafka
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # Kafka Consumer/Processor Service
  consumer:
    build: ./consumer
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:29092
      - BACKEND_API_URL=http://backend:3000/api
      - REDIS_URL=redis://redis:6379
    depends_on:
      - kafka
      - backend
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    env_file: 
      - path: ./.env
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Redis for caching (optional but recommended)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  # Monitoring (optional)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local